baseURL = 'https://opscode.io/'
enableRobotsTXT = true
languageCode = 'en-us'
title = 'Opscode — Linux & Infrastructure Engineering'
theme = 'PaperMod'

[taxonomies]
  tag = "tags"

[params]
  env = "production"
  description = "Systems engineer writing about Linux, DevOps, automation, security, and infrastructure."
  images = ["/og-default.png"]
  author = "Malcolm Frazier"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  UseHugoToc = true
  [params.label]
    text = "Opscode"
  [params.homeInfoParams]
    Title = "Hi, I'm Malcolm"
    Content = "Systems engineer writing about Linux, DevOps, automation, security, and infrastructure."
  [[params.socialIcons]]
    name = "github"
    url  = "https://github.com/mfrazier"
  [[params.socialIcons]]
    name = "linkedin"
    url  = "https://www.linkedin.com/in/malcolm-frazier-7378a574/"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20

[markup.goldmark.renderer]
  unsafe = true
[markup.highlight]
  noClasses = false

[pagination]
  pagerSize = 10
